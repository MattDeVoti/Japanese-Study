name: Omedetou
options:
  bundleIdPrefix: com.mattdevoti1
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    # Signing lives here rather than in Xcode's UI on purpose: this file
    # regenerates the project, so a team picked from the dropdown is silently
    # discarded the next time `xcodegen generate` runs — typically right before
    # an archive, which is the worst possible moment to lose it.
    DEVELOPMENT_TEAM: H4VZM6PP4T
    CODE_SIGN_STYLE: Automatic

targets:
  Omedetou:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/Omedetou
        createIntermediateGroups: true
        excludes:
          - "**/.DS_Store"
      - path: Sources/Shared
        createIntermediateGroups: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mattdevoti1.omedetou
        INFOPLIST_FILE: Sources/Omedetou/Info.plist
        # --- Cross-device sync (ON) ---------------------------------------
        # Needs a PAID Apple Developer Program membership, which is now in
        # place. This file also carries the App Group the widget reads its
        # snapshot from, so switching back to the plain entitlements below
        # silently breaks the widget as well as sync — WidgetShared falls back
        # to a non-shared defaults suite and simply shows nothing.
        #
        # Requires, in the Developer portal: App Group
        # `group.com.mattdevoti1.omedetou` and iCloud container
        # `iCloud.com.mattdevoti1.omedetou`, both enabled on the App ID. Then
        # tick iCloud ▸ CloudKit and Key-value storage in Xcode ▸ Signing &
        # Capabilities.
        CODE_SIGN_ENTITLEMENTS: Sources/Omedetou/Omedetou-iCloud.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ICLOUD_SYNC"
        # Fallback for a free personal team, which cannot sign iCloud at all:
        # CODE_SIGN_ENTITLEMENTS: Sources/Omedetou/Omedetou.entitlements
        # SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: "NO"
    dependencies:
      - sdk: libsqlite3.tbd
      - target: OmedetouWidgets
        embed: true

  OmedetouWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/OmedetouWidgets
        createIntermediateGroups: true
        excludes:
          - "**/.DS_Store"
      - path: Sources/Shared
        createIntermediateGroups: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mattdevoti1.omedetou.widgets
        INFOPLIST_FILE: Sources/OmedetouWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/OmedetouWidgets/OmedetouWidgets.entitlements
        GENERATE_INFOPLIST_FILE: "NO"
        SKIP_INSTALL: "YES"
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

# One shared scheme, checked in, that runs the app.
#
# Without this the project ships no schemes at all, so Xcode invents one per
# target — including OmedetouWidgets. Running *that* one installs the app and
# then asks WidgetKit to display the widget, which fails on a device with
# "SendProcessControlEvent … Failed to show Widget". Regenerating the project
# lets Xcode re-pick which scheme is selected, so the wrong one keeps coming
# back on its own.
#
# Declaring it here makes the app scheme deterministic and survive
# `xcodegen generate`. The widget builds as a dependency of the app, so there's
# nothing to add for it — and Xcode will still auto-create a widget scheme if
# you ever want to debug the extension directly.
schemes:
  Omedetou:
    build:
      targets:
        Omedetou: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
